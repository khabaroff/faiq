[project]
name = "guides"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "yt-dlp>=2024.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tracing = ["langfuse"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guides"]
