[project]
name = "guides"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "yt-dlp>=2024.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "tiktoken>=0.12.0",
    "tenacity>=9.1.4",
    "trafilatura>=2.0.0",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
]

[project.optional-dependencies]
tracing = ["langfuse"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guides"]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "UP007", "B008", "RUF001"]

[tool.mypy]
strict_optional = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
ignore_errors = false

[[tool.mypy.overrides]]
module = ["guides.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: slow tests",
    "integration: needs external services",
    "unit: pure unit tests",
]
